version: "3.8"

services:
  ops-management:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ops-management
    ports:
      - "8001:8001"
    environment:
      - TZ=Asia/Shanghai
      # 敏感配置通过环境变量注入（或在 backend/.env 中配置后打进镜像，生产建议用 secrets）
      - APP_ENV=prod
    env_file:
      - ./backend/.env
    restart: unless-stopped
    volumes:
      - ./logs:/app/backend/logs
